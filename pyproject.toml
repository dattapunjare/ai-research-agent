[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dattapunjare", email = "dattapunjare3050@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
ai-research-agent = "ai_research_agent:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
